// The price-data layer (com.evi.live.market, self-contained stage B phase 2) and its parity with the bridge's JS readers.
//   marketParityTest   every public synthetic vector recorded from the real bridge JS (tools/parity-market-vectors.mjs),
//                      through the list ports AND the plugin's own per-hour archive read by build(); 0 divergences
//   marketIntentTest   the traps as intent: half-up rounding, the one network class (URLs, User-Agent, threads, one in
//                      flight), files never moved over, two clients, the scheduler's order, spacing, back-off, shutdown
//   marketMemoryTest   heap kept and peak for a 336-hour build at the real archive's size, under -Xmx768m
tasks.register('marketParityTest', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.evi.live.market.MarketParityTest'
    maxHeapSize = '1g'
}
