// gamevalTest asserts every client id in GeIds equals the deprecated constant it replaced. It is in
// `check` deliberately: the ids are the one thing in this plugin a game update can silently move
// under us, which is exactly what happened on 30 Sept 2026.
// Voluntary trade-log sharing (9 Oct 2026): the CSV the player saves and sends themselves, and the sidebar invitation.
tasks.register('tradeLogExportTest', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.evi.live.journal.TradeLogExportTest'
