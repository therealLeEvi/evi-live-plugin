plugins { id 'java' }
repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}
// Pinned to the official 1.12.39 release. 1.12.38 predates net.runelite.client.util.Filepath and
// Plugin#getPluginDirectory() and failed to compile, so this was previously pinned to
// 1.12.40-SNAPSHOT, when no release had them. 1.12.39 does (checked in the release jar itself on
// 2026-09-18), so the build moved to it, for two reasons:
//   * `gradlew run` launches a client that identifies as whatever version this is, and the Plugin
//     Hub only publishes manifests for real releases -- manifest/1.12.39_full.js exists,
//     manifest/1.12.40-SNAPSHOT_full.js is a 404. On the snapshot, "downloading the plugin manifest
//     failed" and no Hub plugin (e.g. Flipping Copilot) could be installed next to EVI.
//   * a release is immutable; repo.runelite.net can republish a SNAPSHOT with different bytes under
//     the same name, which is a poor pin for something going through Hub review.
// Pinned exactly rather than '+', so the build never drifts to whatever is newest. Move it forward
// deliberately when a newer release is out.
//
// MATCH plugin-hub/runelite.version, ALWAYS. The Plugin Hub compiles every plugin against the
// version IT pins, not the one declared here, so a green build locally proves nothing about the
// Hub's. On 28 Sept 2026 the Hub moved to 1.13.0 while this said 1.12.39, and 3.9.0 passed every
// local check and then failed the Hub's build: 1.13.0 widened GrandExchangeOffer.getPrice() and
// getSpent() from int to long. Read it before any release:
//     curl -s https://raw.githubusercontent.com/runelite/plugin-hub/master/runelite.version
def runeLiteVersion = '1.13.1'
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
}
group = 'com.evi'
version = '4.0.0'
