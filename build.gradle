//   journalIntentTest   the traps, written as intent (half-up ties, the tax cap, probes, accounts, locale)
//   journalVectorsTest  generated edge cases, every expectation a recorded JS answer, journal lines byte for byte
//   parityTest          every public golden transcript recorded from the real bridge
// Public fixtures are synthetic and live in src/test/resources/parity (copied there from the project's recorder).
tasks.register('journalIntentTest', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.evi.live.journal.JournalIntentTest'
}
