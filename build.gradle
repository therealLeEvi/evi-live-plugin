// The Plugin Hub's forbidden-API list (revised 6 Oct 2026) over every main source file, comments and strings
// removed first: reflection, JNI/JNA, subprocesses, runtime code loading, Thread.sleep/interrupt, java.io file
// APIs, network clients other than OkHttp, our own Gson/OkHttp instances, Filepath.Unchecked, and the rest.
// The scanner proves itself on known-bad and known-good snippets before it reads the source.
tasks.register('hubRulesTest', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.evi.live.HubRulesScanTest'
    systemProperty 'evi.mainSource', file('src/main/java').absolutePath
    inputs.dir('src/main/java')
}
