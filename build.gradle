// The plugin's own engine (4.0.0: the only mode).
//   inProcessEngineTest  the in-process engine (com.evi.live.inprocess) through its real thread and a real plugin journal: with the
//                        336-hour basis every in-scope transcript poll AGREES with the recorded body (the old companion app's answer);
//                        one hour short no buy, no further position, no reachable figure, while every recorded SELL and the advice still
//                        speak; the price-history line; the query without the buy tiers; the thread (never blocking, newest wins, never
//                        the client thread/EDT); the price layer's archive read (ReadHoursCheck)
//   inProcessWiringTest  the plugin: no bridge code at all, no bridge or pairing wording visible, draws the engine's answer and the
//                        price-history line, never runs decide on the calling thread, never blocks the poll; the one-voice-per-offer rule
