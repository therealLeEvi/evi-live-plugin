tasks.named('check') { dependsOn 'observationTest', 'panelTest', 'economyTest', 'deliveryTest', 'suggestionTest', 'hintTest', 'searchHighlightTest', 'itemSelectTest', 'gamevalTest', 'riskSkipTest', 'journalIntentTest', 'journalVectorsTest', 'parityTest', 'pluginJournalTest', 'journalWiringTest', 'hubRulesTest', 'sidebarLinesTest', 'marketParityTest', 'marketIntentTest', 'marketMemoryTest', 'engineVectorsTest', 'engineIntentTest', 'tierVectorsTest', 'tierIntentTest', 'engineTranscriptTest', 'engineDecideIntentTest', 'adviceVectorsTest', 'adviceIntentTest', 'adviceTranscriptTest', 'marketTierVectorsTest', 'marketTierIntentTest', 'forecastVectorsTest', 'inProcessEngineTest', 'inProcessWiringTest', 'inProcessButtonsTest', 'inProcessStoresTest', 'releaseListingTest', 'tradeLogExportTest', 'shareInviteTest' }
// Test tasks log to the console only, never into the real ~/.runelite/logs/client.log (src/test/logback-tests.xml); `run` keeps RuneLite's.
tasks.withType(JavaExec).matching { it.name != 'run' }.configureEach { systemProperty 'logback.configurationFile', file('src/test/logback-tests.xml').absolutePath }
